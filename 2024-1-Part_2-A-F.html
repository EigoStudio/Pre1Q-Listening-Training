<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英検準1級 Listening Activity (Part 2 A〜F)</title>
<script src="auth.js"></script>
  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --success: #10b981;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', 'Noto Sans JP', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .app-container {
      width: 100%;
      max-width: 640px;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border-color);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px 20px;
      background: #ffffff;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge {
      background: #eff6ff;
      color: var(--primary);
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
    }

    .btn-back {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: color 0.2s;
    }

    .btn-back:hover {
      color: var(--primary);
    }

    .view {
      padding: 24px 20px;
      display: none;
    }

    .view.active {
      display: block;
    }

    .menu-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 20px;
      text-align: center;
      line-height: 1.5;
    }

    .topic-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .topic-btn {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
    }

    .topic-btn:hover {
      border-color: var(--primary);
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.1);
    }

    .topic-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .topic-letter {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: #eff6ff;
      color: var(--primary);
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
    }

    .topic-name {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .topic-count {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: #f1f5f9;
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .progress-bar {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.3s ease;
    }

    .quiz-status {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 16px;
      font-weight: 500;
    }

    .audio-card {
      background: #f8fafc;
      border: 1px dashed var(--border-color);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .audio-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
      transition: all 0.2s ease;
    }

    .audio-btn:hover {
      background: var(--primary-hover);
      transform: scale(1.05);
    }

    .audio-btn:active {
      transform: scale(0.95);
    }

    .audio-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .btn-show-options {
      width: 100%;
      padding: 12px;
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      margin-bottom: 20px;
    }

    .btn-show-options:hover {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .option-btn {
      width: 100%;
      padding: 12px 16px;
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      text-align: left;
      font-size: 0.85rem;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.2s ease;
      line-height: 1.4;
    }

    .option-btn:hover {
      border-color: var(--primary);
      background: #f0f7ff;
    }

    .option-btn.correct {
      border-color: var(--success);
      background: #ecfdf5;
      color: #065f46;
      font-weight: 600;
    }

    .option-btn.wrong {
      border-color: var(--danger);
      background: #fef2f2;
      color: #991b1b;
      opacity: 0.7;
    }

    .option-btn:disabled {
      cursor: default;
    }

    .script-box {
      background: #f1f5f9;
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 20px;
      display: none;
    }

    .script-box.active {
      display: block;
    }

    .script-header {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .script-text-en {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 6px;
      line-height: 1.4;
    }

    .script-text-ja {
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .next-btn {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: none;
      transition: background 0.2s;
    }

    .next-btn:hover {
      background: var(--primary-hover);
    }

    .next-btn.active {
      display: block;
    }

    .summary-card {
      text-align: center;
      padding: 20px 0;
    }

    .score-circle {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: #eff6ff;
      color: var(--primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      border: 3px solid var(--primary);
    }

    .score-num {
      font-size: 1.8rem;
      font-weight: 700;
    }

    .score-total {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .summary-msg {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .summary-sub {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .btn-group {
      display: flex;
      gap: 10px;
    }

    .btn-secondary {
      flex: 1;
      padding: 10px;
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--text-main);
      cursor: pointer;
    }

    .btn-primary {
      flex: 1;
      padding: 10px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <div class="header-title">
        <span>英検準1級 Listening Activity</span>
        <span class="badge">Part 2 全文網羅</span>
      </div>
      <button id="btnBackHome" class="btn-back" style="display: none;">
        <i class="fa-solid fa-house"></i> トップ
      </button>
    </header>

    <!-- MENU VIEW -->
    <div id="viewMenu" class="view active">
      <p class="menu-desc">苦手なパッセージを選んでトレーニングが行えます。<br>1文ずつしっかり聞き取って正解の和訳を選びましょう。</p>
      
      <div class="topic-grid">
        <button class="topic-btn" onclick="startQuiz('A')">
          <div class="topic-info">
            <div class="topic-letter">A</div>
            <div>
              <div class="topic-name">Locust Swarms</div>
              <div class="topic-count" id="count-A">問題数: -</div>
            </div>
          </div>
          <i class="fa-solid fa-chevron-right" style="color: var(--text-muted); font-size: 0.8rem;"></i>
        </button>

        <button class="topic-btn" onclick="startQuiz('B')">
          <div class="topic-info">
            <div class="topic-letter">B</div>

              <div class="topic-name">Golden-Shouldered Parrots</div>
              <div class="topic-count" id="count-B">問題数: -</div>
            </div>
          </div>
          <i class="fa-solid fa-chevron-right" style="color: var(--text-muted); font-size: 0.8rem;"></i>
        </button>

        <button class="topic-btn" onclick="startQuiz('C')">
          <div class="topic-info">
            <div class="topic-letter">C</div>
            <div>
              <div class="topic-name">Astronaut Efficiency</div>
              <div class="topic-count" id="count-C">問題数: -</div>
            </div>
          </div>
          <i class="fa-solid fa-chevron-right" style="color: var(--text-muted); font-size: 0.8rem;"></i>
        </button>

        <button class="topic-btn" onclick="startQuiz('D')">
          <div class="topic-info">
            <div class="topic-letter">D</div>
            <div>
              <div class="topic-name">The Oxus Civilization</div>
              <div class="topic-count" id="count-D">問題数: -</div>
            </div>
          </div>
          <i class="fa-solid fa-chevron-right" style="color: var(--text-muted); font-size: 0.8rem;"></i>
        </button>

        <button class="topic-btn" onclick="startQuiz('E')">
          <div class="topic-info">
            <div class="topic-letter">E</div>
            <div>
              <div class="topic-name">The Nukus Museum of Art</div>
              <div class="topic-count" id="count-E">問題数: -</div>
            </div>
          </div>
          <i class="fa-solid fa-chevron-right" style="color: var(--text-muted); font-size: 0.8rem;"></i>
        </button>

        <button class="topic-btn" onclick="startQuiz('F')">
          <div class="topic-info">
            <div class="topic-letter">F</div>
            <div>
              <div class="topic-name">Cutting Grass</div>
              <div class="topic-count" id="count-F">問題数: -</div>
            </div>
          </div>
          <i class="fa-solid fa-chevron-right" style="color: var(--text-muted); font-size: 0.8rem;"></i>
        </button>
      </div>
    </div>

    <!-- QUIZ VIEW -->
    <div id="viewQuiz" class="view">
      <div class="progress-bar-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <div class="quiz-status">
        <span id="topicIndicator">Activity A</span>
        <span id="questionCounter">Q 1 / 5</span>
      </div>

      <div class="audio-card">
        <button class="audio-btn" id="btnPlayAudio" onclick="playCurrentAudio()">
          <i class="fa-solid fa-volume-high"></i>
        </button>
        <span class="audio-label">タップして音声を聞く</span>
      </div>

      <button class="btn-show-options" id="btnShowOptions" onclick="revealOptions()">
        <i class="fa-regular fa-eye"></i> 選択肢を表示する
      </button>

      <div class="options-container" id="optionsContainer" style="display: none;"></div>

      <div class="script-box" id="scriptBox">
        <div class="script-header">英文スクリプト & 正解和訳</div>
        <div class="script-text-en" id="scriptEn"></div>
        <div class="script-text-ja" id="scriptJa"></div>
      </div>

      <button class="next-btn" id="btnNext" onclick="nextQuestion()">次の問題へ</button>
    </div>

    <!-- RESULT VIEW -->
    <div id="viewResult" class="view">
      <div class="summary-card">
        <div class="score-circle">
          <div class="score-num" id="finalScore">0</div>
          <div class="score-total" id="finalTotal">/ 0</div>
        </div>
        <div class="summary-msg" id="summaryTitle">おつかれさまでした！</div>
        <div class="summary-sub" id="summarySub">繰り返し練習してリスニング力を高めましょう。</div>

        <div class="btn-group">
          <button class="btn-secondary" onclick="showMenu()">一覧へ戻る</button>
          <button class="btn-primary" onclick="retryCurrentQuiz()">もう一度挑戦</button>
        </div>
      </div>
    </div>
  </div>

    let currentTopicKey = 'A';
    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;

    // 添付していただいたHTMLの音声初期化処理を適用
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = function() {
        window.speechSynthesis.getVoices();
      };
    }

    document.addEventListener('DOMContentLoaded', () => {
      for (const key in quizData) {
        const el = document.getElementById(`count-${key}`);
        if (el) {
          el.innerText = `問題数: ${quizData[key].questions.length}`;
        }
      }
    });

    // 添付いただいたHTMLファイルと同じ音声呼び出し（speakCurrentWord）ロジック
    function playCurrentAudio() {
      if (!('speechSynthesis' in window)) return;
      
      const txt = currentQuestions[currentIndex].en;
      window.speechSynthesis.cancel();
      
      let u = new SpeechSynthesisUtterance(txt);
      u.lang = "en-US"; 
      u.rate = 0.7; // ご指定通り速度を 0.7 に設定

      const voices = window.speechSynthesis.getVoices();
      const fv = voices.find(v => v.name.includes("Google US English") || v.name.includes("Female") || v.name.includes("Zira"));
      if (fv) u.voice = fv;
      
      window.speechSynthesis.speak(u);
    }

    function showView(viewId) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');
      
      const btnBack = document.getElementById('btnBackHome');
      if (viewId === 'viewMenu') {
        btnBack.style.display = 'none';
      } else {
        btnBack.style.display = 'flex';
      }
    }

    function showMenu() {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      showView('viewMenu');
    }

    document.getElementById('btnBackHome').addEventListener('click', showMenu);

    function startQuiz(topicKey) {
      currentTopicKey = topicKey;
      const topic = quizData[topicKey];
      if (!topic || topic.questions.length === 0) return;

      currentQuestions = [...topic.questions];
      currentIndex = 0;
      score = 0;

      document.getElementById('topicIndicator').innerText = `Activity ${topicKey}: ${topic.title}`;
      showView('viewQuiz');
      loadQuestion();
    }

    function retryCurrentQuiz() {
      startQuiz(currentTopicKey);
    }

    function loadQuestion() {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();

      const q = currentQuestions[currentIndex];
      const total = currentQuestions.length;

      document.getElementById('questionCounter').innerText = `Q ${currentIndex + 1} / ${total}`;
      const progressPercent = ((currentIndex) / total) * 100;
      document.getElementById('progressBar').style.width = `${progressPercent}%`;

      document.getElementById('btnShowOptions').style.display = 'flex';
      
      const optionsContainer = document.getElementById('optionsContainer');
      optionsContainer.style.display = 'none';
      optionsContainer.innerHTML = '';

      const optionsWithIndex = q.options.map((opt, idx) => ({ text: opt, originalIndex: idx }));
      for (let i = optionsWithIndex.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [optionsWithIndex[i], optionsWithIndex[j]] = [optionsWithIndex[j], optionsWithIndex[i]];
      }

      optionsWithIndex.forEach((optObj) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = optObj.text;
        btn.onclick = () => handleAnswer(optObj.originalIndex, btn);
        optionsContainer.appendChild(btn);
      });

      const scriptBox = document.getElementById('scriptBox');
      scriptBox.classList.remove('active');
      document.getElementById('scriptEn').innerText = q.en;
      document.getElementById('scriptJa').innerText = q.options[q.answer];

      document.getElementById('btnNext').classList.remove('active');

      setTimeout(() => {
        playCurrentAudio();
      }, 300);
    }

    function revealOptions() {
      document.getElementById('btnShowOptions').style.display = 'none';
      document.getElementById('optionsContainer').style.display = 'flex';
    }

    function handleAnswer(selectedIndex, clickedBtn) {
      const q = currentQuestions[currentIndex];
      const optionButtons = document.querySelectorAll('.option-btn');

      optionButtons.forEach(btn => btn.disabled = true);

      if (selectedIndex === q.answer) {
        clickedBtn.classList.add('correct');
        score++;
      } else {
        clickedBtn.classList.add('wrong');
        optionButtons.forEach(btn => {
          if (btn.innerText === q.options[q.answer]) {
            btn.classList.add('correct');
          }
        });
      }

      document.getElementById('scriptBox').classList.add('active');
      document.getElementById('btnNext').classList.add('active');
    }

    function nextQuestion() {
      currentIndex++;
      if (currentIndex < currentQuestions.length) {
        loadQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      document.getElementById('progressBar').style.width = `100%`;
      document.getElementById('finalScore').innerText = score;
      document.getElementById('finalTotal').innerText = `/ ${currentQuestions.length}`;

      const percentage = (score / currentQuestions.length) * 100;
      const titleEl = document.getElementById('summaryTitle');
      const subEl = document.getElementById('summarySub');

      if (percentage === 100) {
        titleEl.innerText = "全問正解！完璧です！";
        subEl.innerText = "このパッセージの英文は完璧に聞き取れています。";
      } else if (percentage >= 60) {
        titleEl.innerText = "合格ライン達成！";
        subEl.innerText = "間違えた文のスクリプトをもう一度確認してみましょう。";
      } else {
        titleEl.innerText = "もう一度チャレンジ！";
        subEl.innerText = "繰り返し聞き込むことで英検準1級の音に慣れていきましょう。";
      }

      showView('viewResult');
    }
